<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <script>
      (() => {
        const saved = localStorage.getItem("massavo-theme");
        const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Sora:wght@500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    {% if page.hero_image %}
    <link rel="preload" as="image" href="{{ page.hero_image | relative_url }}" fetchpriority="high" />
    {% endif %}
    {% if page.math %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true,
          tags: "ams",
        },
        svg: {
          fontCache: "global",
        },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>
    {% endif %}
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  </head>
  <body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    {% include header.html %}

    <main id="contenu"{% if page.main_class %} class="{{ page.main_class }}"{% endif %}>
      {{ content }}
    </main>

    {% include footer.html %}
    {% include search-index.html %}
    <script src="{{ '/script.js' | relative_url }}"></script>
  </body>
</html>
