title: Massavo Salako
description: Portfolio de Massavo Salako, ingénieur en génie mathématique et modélisation.
url: https://manusalako.github.io
baseurl: ""
lang: fr
timezone: Africa/Porto-Novo
assets_version: 20260901-3

author:
  name: Massavo Salako
  full_name: Massavo Emmanuel Salako
  email: smassavo@gmail.com
  location: Cotonou, Bénin
  github: https://github.com/manusalako
  linkedin: https://www.linkedin.com/in/emmanuel-salako-812a18281/
  cv: /assets/cv-massavo-salako.pdf

comments:
  repository: manusalako/manusalako.github.io

markdown: kramdown
permalink: pretty

kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

collections:
  projets:
    output: true
    permalink: /projets/:name.html
  publications:
    output: true
    permalink: /publications/:name.html
  notes:
    output: true
    permalink: /notes/:name.html
  enseignements:
    output: true
    permalink: /enseignement/:name.html

defaults:
  - scope:
      path: ""
      type: projets
    values:
      layout: project
      nav: travaux
      comments: true
      math: true
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      nav: travaux
      comments: true
      math: true
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      nav: travaux
      comments: true
      math: true
  - scope:
      path: ""
      type: enseignements
    values:
      layout: teaching
      nav: enseignement
      math: true

exclude:
  - .bundle
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - GUIDE_CONTENU.md
  - README.md
  - scripts
  - vendor
  - _modeles
