<section id="discussion" class="section-shell project-discussion content-discussion reveal" aria-labelledby="titre-discussion">
  <h2 id="titre-discussion">Discussion</h2>
  <div
    class="comments-root"
    data-comment-term="{{ include.term }}"
    aria-label="Commentaires pour {{ include.title | escape }}"
  ></div>
  <noscript>
    <p class="comments-noscript">Activez JavaScript pour consulter et publier des commentaires.</p>
  </noscript>
</section>
