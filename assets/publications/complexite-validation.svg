<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Erreur d’apprentissage et de validation selon la complexité</title>
  <desc id="desc">La courbe d’apprentissage diminue, tandis que la courbe de validation forme un U.</desc>
  <rect width="960" height="360" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="56" y="42" fill="#202124" font-size="18" font-weight="700">Complexité et généralisation</text>
    <text x="56" y="66" fill="#6b7280" font-size="12">schéma conceptuel</text>
    <g stroke="#e5e7eb"><line x1="82" y1="100" x2="82" y2="300"/><line x1="82" y1="300" x2="910" y2="300"/></g>
    <path d="M100 112 C245 145 375 190 520 231 C650 264 780 278 894 285" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M100 245 C235 185 355 139 470 132 C585 127 710 174 894 263" fill="none" stroke="#cf566c" stroke-width="3"/>
    <line x1="470" y1="132" x2="470" y2="300" stroke="#cf566c" stroke-dasharray="6 5" opacity="0.7"/>
    <circle cx="470" cy="132" r="6" fill="#cf566c"/>
    <g fill="#4b5563" font-size="12">
      <text x="85" y="326">modèle simple</text><text x="794" y="326">modèle complexe</text>
      <text x="486" y="118" fill="#cf566c">zone de compromis</text>
      <text x="720" y="246" fill="#cf566c">validation</text><text x="720" y="282">apprentissage</text>
    </g>
  </g>
</svg>
