<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Trajectoires simulées du prix d’un actif</title>
  <desc id="desc">Plusieurs trajectoires de Monte Carlo et leur trajectoire moyenne.</desc>
  <rect width="960" height="360" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="56" y="42" fill="#202124" font-size="18" font-weight="700">Trajectoires de Monte Carlo</text>
    <text x="56" y="66" fill="#6b7280" font-size="12">100 au départ · données simulées</text>
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="72" y1="100" x2="910" y2="100"/><line x1="72" y1="150" x2="910" y2="150"/>
      <line x1="72" y1="200" x2="910" y2="200"/><line x1="72" y1="250" x2="910" y2="250"/>
      <line x1="72" y1="300" x2="910" y2="300"/>
    </g>
    <g fill="none" stroke="#cbd5e1" stroke-width="1.4" opacity="0.9">
      <polyline points="72,230 142,205 212,218 282,174 352,190 422,145 492,164 562,118 632,136 702,104 772,125 842,82 910,98"/>
      <polyline points="72,230 142,242 212,221 282,236 352,207 422,226 492,184 562,201 632,170 702,188 772,151 842,169 910,138"/>
      <polyline points="72,230 142,260 212,248 282,275 352,238 422,257 492,229 562,248 632,214 702,239 772,201 842,222 910,184"/>
      <polyline points="72,230 142,188 212,201 282,151 352,166 422,122 492,139 562,91 632,111 702,76 772,98 842,60 910,74"/>
      <polyline points="72,230 142,220 212,236 282,211 352,225 422,196 492,210 562,178 632,195 702,160 772,177 842,143 910,156"/>
      <polyline points="72,230 142,247 212,229 282,198 352,214 422,181 492,194 562,155 632,174 702,132 772,149 842,117 910,129"/>
    </g>
    <polyline points="72,230 142,227 212,226 282,207 352,207 422,188 492,197 562,165 632,171 702,150 772,154 842,132 910,130" fill="none" stroke="#cf566c" stroke-width="3"/>
    <line x1="72" y1="230" x2="910" y2="230" stroke="#9ca3af" stroke-dasharray="5 5"/>
    <g fill="#4b5563" font-size="12">
      <text x="70" y="326">0</text><text x="270" y="326">3 mois</text><text x="480" y="326">6 mois</text>
      <text x="690" y="326">9 mois</text><text x="870" y="326">12 mois</text>
    </g>
    <line x1="752" y1="40" x2="780" y2="40" stroke="#cf566c" stroke-width="3"/><text x="790" y="44" fill="#4b5563" font-size="11">moyenne simulée</text>
  </g>
</svg>
