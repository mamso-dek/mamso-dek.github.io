<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Décomposition simulée du profit et de la perte</title>
  <desc id="desc">Diagramme en barres des contributions de cinq facteurs et ligne de contribution cumulée.</desc>
  <rect width="960" height="360" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="56" y="42" fill="#202124" font-size="18" font-weight="700">Contributions simulées au P&amp;L</text>
    <text x="56" y="66" fill="#6b7280" font-size="12">unités monétaires · illustration méthodologique</text>
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="72" y1="100" x2="910" y2="100"/><line x1="72" y1="160" x2="910" y2="160"/>
      <line x1="72" y1="220" x2="910" y2="220"/><line x1="72" y1="280" x2="910" y2="280"/>
    </g>
    <line x1="72" y1="190" x2="910" y2="190" stroke="#9ca3af" stroke-width="1.5"/>
    <g fill="#2f6b5c">
      <rect x="125" y="118" width="76" height="72" rx="2"/>
      <rect x="405" y="88" width="76" height="102" rx="2"/>
      <rect x="685" y="145" width="76" height="45" rx="2"/>
    </g>
    <g fill="#cf566c">
      <rect x="265" y="190" width="76" height="58" rx="2"/>
      <rect x="545" y="190" width="76" height="82" rx="2"/>
      <rect x="825" y="190" width="52" height="28" rx="2"/>
    </g>
    <polyline points="163,118 303,176 443,74 583,156 723,111 851,139" fill="none" stroke="#202124" stroke-width="2.5"/>
    <g fill="#202124">
      <circle cx="163" cy="118" r="4"/><circle cx="303" cy="176" r="4"/><circle cx="443" cy="74" r="4"/>
      <circle cx="583" cy="156" r="4"/><circle cx="723" cy="111" r="4"/><circle cx="851" cy="139" r="4"/>
    </g>
    <g fill="#4b5563" font-size="12" text-anchor="middle">
      <text x="163" y="308">Taux</text><text x="303" y="308">Change</text><text x="443" y="308">Actions</text>
      <text x="583" y="308">Volatilité</text><text x="723" y="308">Liquidité</text><text x="851" y="308">Résidu</text>
    </g>
    <g font-size="11">
      <rect x="654" y="34" width="12" height="12" fill="#2f6b5c"/><text x="673" y="44" fill="#4b5563">positive</text>
      <rect x="742" y="34" width="12" height="12" fill="#cf566c"/><text x="761" y="44" fill="#4b5563">négative</text>
      <line x1="831" y1="40" x2="850" y2="40" stroke="#202124" stroke-width="2"/><text x="858" y="44" fill="#4b5563">cumul</text>
    </g>
  </g>
</svg>
