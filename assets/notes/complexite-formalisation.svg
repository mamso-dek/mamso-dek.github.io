<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Comparaison de deux modèles sur des observations simulées</title>
  <desc id="desc">Des points observés sont accompagnés d’un modèle simple régulier et d’un modèle trop complexe oscillant.</desc>
  <rect width="960" height="360" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="56" y="42" fill="#202124" font-size="18" font-weight="700">Choisir la complexité utile</text>
    <text x="56" y="66" fill="#6b7280" font-size="12">observations et deux formalisations possibles</text>
    <g stroke="#e5e7eb"><line x1="72" y1="300" x2="910" y2="300"/><line x1="72" y1="95" x2="72" y2="300"/></g>
    <g fill="#334155" opacity="0.75">
      <circle cx="115" cy="260" r="5"/><circle cx="170" cy="235" r="5"/><circle cx="225" cy="244" r="5"/><circle cx="280" cy="201" r="5"/>
      <circle cx="335" cy="214" r="5"/><circle cx="390" cy="170" r="5"/><circle cx="445" cy="182" r="5"/><circle cx="500" cy="143" r="5"/>
      <circle cx="555" cy="157" r="5"/><circle cx="610" cy="119" r="5"/><circle cx="665" cy="135" r="5"/><circle cx="720" cy="107" r="5"/>
      <circle cx="775" cy="121" r="5"/><circle cx="830" cy="92" r="5"/><circle cx="880" cy="104" r="5"/>
    </g>
    <path d="M90 267 C250 234 410 187 570 145 C700 112 800 98 900 91" fill="none" stroke="#2f6b5c" stroke-width="3"/>
    <path d="M90 274 C140 218 190 285 240 217 C290 157 340 252 390 173 C440 105 490 215 540 141 C590 78 640 185 690 119 C740 63 790 166 840 96 C865 70 882 92 900 100" fill="none" stroke="#cf566c" stroke-width="2.5"/>
    <g font-size="11">
      <line x1="660" y1="42" x2="687" y2="42" stroke="#2f6b5c" stroke-width="3"/><text x="695" y="46" fill="#4b5563">modèle parcimonieux</text>
      <line x1="810" y1="42" x2="837" y2="42" stroke="#cf566c" stroke-width="3"/><text x="845" y="46" fill="#4b5563">modèle instable</text>
    </g>
  </g>
</svg>
