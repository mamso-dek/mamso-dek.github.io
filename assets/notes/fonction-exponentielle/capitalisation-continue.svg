<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Convergence de la capitalisation composée vers e</title>
  <desc id="desc">Valeurs de un plus un sur n puissance n pour plusieurs fréquences de capitalisation.</desc>
  <rect width="1000" height="520" fill="#ffffff"/>
  <g fill="none" stroke="#d8d8d4" stroke-width="1">
    <path d="M100 70V420H920"/>
    <path d="M100 400H920M100 293.3H920M100 186.7H920M100 80H920"/>
  </g>
  <g fill="#5e625f" font-family="IBM Plex Mono, monospace" font-size="16" text-anchor="end">
    <text x="88" y="406">2,00</text><text x="88" y="299">2,25</text>
    <text x="88" y="193">2,50</text><text x="88" y="86">2,75</text>
  </g>
  <path d="M100 93.5H920" stroke="#cf566c" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="830" y="70" fill="#cf566c" font-family="IBM Plex Mono, monospace" font-size="18">e = 2,71828...</text>
  <polyline points="135,400 260,293.3 385,211.7 510,138.5 635,104.5 760,95.1 885,93.5"
            fill="none" stroke="#2f6b5c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2f6b5c">
    <circle cx="135" cy="400" r="8"/><circle cx="260" cy="293.3" r="8"/><circle cx="385" cy="211.7" r="8"/>
    <circle cx="510" cy="138.5" r="8"/><circle cx="635" cy="104.5" r="8"/><circle cx="760" cy="95.1" r="8"/>
    <circle cx="885" cy="93.5" r="8"/>
  </g>
  <g fill="#5e625f" font-family="IBM Plex Mono, monospace" font-size="17" text-anchor="middle">
    <text x="135" y="454">1</text><text x="260" y="454">2</text><text x="385" y="454">4</text>
    <text x="510" y="454">12</text><text x="635" y="454">52</text><text x="760" y="454">365</text><text x="885" y="454">∞</text>
    <text x="135" y="382">2,000</text><text x="260" y="275">2,250</text><text x="385" y="194">2,441</text>
    <text x="510" y="121">2,613</text><text x="635" y="135">2,693</text><text x="760" y="126">2,715</text>
    <text x="885" y="124">2,718</text>
  </g>
  <text x="510" y="495" fill="#1f211f" font-family="Sora, sans-serif" font-size="20" text-anchor="middle">Nombre de capitalisations dans l’année</text>
</svg>
