<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Courbe de calibration d’un modèle probabiliste</title>
  <desc id="desc">La fréquence observée est comparée à la probabilité prévue et reste proche de la diagonale idéale.</desc>
  <rect width="960" height="360" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="56" y="42" fill="#202124" font-size="18" font-weight="700">Calibration des probabilités</text>
    <text x="56" y="66" fill="#6b7280" font-size="12">exemple sur données simulées</text>
    <g stroke="#e5e7eb"><line x1="100" y1="95" x2="100" y2="300"/><line x1="100" y1="300" x2="870" y2="300"/></g>
    <line x1="100" y1="300" x2="870" y2="95" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
    <polyline points="100,300 190,278 280,250 370,226 460,203 550,171 640,156 730,124 820,112 870,95" fill="none" stroke="#cf566c" stroke-width="3"/>
    <g fill="#cf566c">
      <circle cx="190" cy="278" r="5"/><circle cx="280" cy="250" r="5"/><circle cx="370" cy="226" r="5"/><circle cx="460" cy="203" r="5"/>
      <circle cx="550" cy="171" r="5"/><circle cx="640" cy="156" r="5"/><circle cx="730" cy="124" r="5"/><circle cx="820" cy="112" r="5"/>
    </g>
    <g fill="#4b5563" font-size="12">
      <text x="410" y="334">probabilité prévue</text><text x="116" y="286">0</text><text x="843" y="319">1</text>
      <text x="705" y="82">calibration idéale</text><text x="676" y="148" fill="#cf566c">modèle évalué</text>
    </g>
    <text transform="translate(36 245) rotate(-90)" fill="#4b5563" font-size="12">fréquence observée</text>
  </g>
</svg>
